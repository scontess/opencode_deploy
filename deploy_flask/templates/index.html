<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask · Progetto predefinito</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 30% 20%, #1e293b, #0b1120 70%);
      color: #e2e8f0;
      padding: 1.5rem;
    }
    main {
      max-width: 34rem;
      width: 100%;
      background: #111827cc;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 20px 60px #0008;
    }
    h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
    p { margin: .4rem 0; color: #94a3b8; line-height: 1.5; }
    .badge {
      display: inline-block;
      font-size: .75rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #34d399;
      background: #34d3991a;
      border: 1px solid #34d39940;
      padding: .25rem .6rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .5rem 1rem;
      margin: 1.5rem 0 0;
      padding-top: 1.5rem;
      border-top: 1px solid #1f2937;
      font-size: .9rem;
    }
    dt { color: #64748b; }
    dd { margin: 0; color: #e2e8f0; font-variant-numeric: tabular-nums; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <span class="badge">● server attivo</span>
    <h1>Ciao da Flask</h1>
    <p>Pagina minima servita da <code>app.py</code> con il template <code>templates/index.html</code>.</p>

    <dl>
      <dt>Data</dt><dd>{{ giorno }}</dd>
      <dt>Ora del server</dt><dd>{{ ora }}</dd>
      <dt>Fuso orario</dt><dd>{{ fuso }}</dd>
      <dt>Indirizzo</dt><dd>{{ indirizzo }}</dd>
    </dl>
  </main>
</body>
</html>
